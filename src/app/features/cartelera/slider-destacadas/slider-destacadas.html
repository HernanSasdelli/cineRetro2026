@if (peliculas()[actual()]; as p) {
  <div class="slider">
    <a class="slider__imagen" [routerLink]="['/pelicula', p.id]">
      <img [src]="p.banner_url || '/banner-placeholder.svg'" [alt]="p.titulo" (error)="sinBanner($event)">
      <span class="slider__titulo">{{ p.titulo | uppercase }}</span>
    </a>

    @if (peliculas().length > 1) {
      <button type="button" class="slider__flecha slider__flecha--izq" (click)="anterior()">‹</button>
      <button type="button" class="slider__flecha slider__flecha--der" (click)="siguiente()">›</button>
    }
  </div>

  @if (peliculas().length > 1) {
    <div class="slider__puntos">
      @for (i of indices(); track i) {
        <button type="button" class="slider__punto" [class.activo]="i === actual()" (click)="ir(i)"></button>
      }
    </div>
  }
}
