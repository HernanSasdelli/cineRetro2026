<a class="ticket" [routerLink]="['/pelicula', pelicula().id]">
  <img class="ticket__poster" [src]="pelicula().imagen_url || '/posters/placeholder.svg'"
       [alt]="'Póster de ' + pelicula().titulo" (error)="sinPoster($event)">
  <div class="ticket__cuerpo">
    <h2>{{ pelicula().titulo | uppercase }}</h2><!-- aca se usa, como la directiva, en vez de llamar cada vez al if, esto lo usa todo el sistema -->
    <p class="ticket__meta">
      {{ pelicula().duracion_min | duracion }}
      @if (pelicula().restriccion_edad) { <span class="edad">+{{ pelicula().restriccion_edad }}</span> }
    </p>
    <p class="ticket__generos">{{ generosTexto() }}</p>
  </div>
</a>
