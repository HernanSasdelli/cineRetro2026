<div class="carrusel">

    <button type="button" class="fila__flecha fila__flecha--izq" (click)="anterior()">‹</button>
  }

  <div class="fila__grilla">
    @for (p of visibles(); track p.id) {
      <app-tarjeta-producto [producto]="p" [conBotones]="false" />

  @if (hayMas()) {

  }
</div>
