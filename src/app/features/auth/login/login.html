<section class="tarjeta">
  <h1>Ingresar</h1>

  <form [formGroup]="form" (ngSubmit)="ingresar()">
    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email">
    </label>
    @if (form.controls.email.touched && form.controls.email.invalid) {
      <small class="error">Ingresá un email válido</small>
    }

    <label>
      Contraseña
      <input type="password" formControlName="password" autocomplete="current-password">
    </label>
    @if (form.controls.password.touched && form.controls.password.invalid) {
      <small class="error">Mínimo 6 caracteres</small>
    }

    @if (error()) { <p class="error">{{ error() }}</p> }

    <button class="btn" type="submit" [disabled]="enviando()">
      {{ enviando() ? 'Ingresando...' : 'Ingresar' }}
    </button>
  </form>

  <div class="acceso-rapido">
    <span class="nota">Acceso rápido:</span>
    <button type="button" class="btn btn--linea" (click)="accesoRapido('admin@cine.com', 'admin123')">Admin</button>
    <button type="button" class="btn btn--linea" (click)="accesoRapido('cliente@cine.com', 'cliente123')">Cliente</button>
  </div>

  <p>¿No tenés cuenta? <a routerLink="/registro">Registrate</a></p>
</section>
